version: 2

sources:
  - name: pagila
    database: PAGILA_ANALYTICS
    schema: RAW_PAGILA
    tables:
      - name: actor
      - name: address
      - name: category
      - name: city
      - name: country
      - name: customer
      - name: film
      - name: film_actor
      - name: film_category
      - name: inventory
      - name: language
      - name: payment
      - name: rental
      - name: staff
      - name: store
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 48, period: hour}

  - name: sakila
    database: PAGILA_ANALYTICS
    schema: RAW_SAKILA
    tables:
      - name: actor
      - name: address
      - name: category
      - name: city
      - name: country
      - name: customer
      - name: film
      - name: film_actor
      - name: film_category
      - name: inventory
      - name: language
      - name: payment
      - name: rental
      - name: staff
      - name: store
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 48, period: hour}